work:
  - id: c-pocket
    company: C-Pocket (Capital Pocket)
    position: { es: Backend Developer, en: Backend Developer }
    # Inicio exacto en las fuentes: 28 de octubre de 2025. Fin: octubre de 2026 (confirmado).
    startDate: 2025-10
    endDate: 2026-10
    summary:
      es: "Alcance fullstack (backend, frontend, integraciones, cloud e IA) en un ecosistema de productos SaaS de pagos, automatización conversacional, PropTech, ticketing y herramientas internas."
      en: "Fullstack scope (backend, frontend, integrations, cloud and AI) across an ecosystem of SaaS products for payments, conversational automation, PropTech, ticketing and internal tools."
    technologies:
      [nodejs, typescript, nestjs, express, php, laravel, python, fastapi, rest-apis, webhooks,
       javascript, react, nextjs, inertia, tailwind, mysql, postgresql, redis, pgvector, prisma,
       sequelize, openai-api, langchain, mcp, whatsapp-cloud-api, slack-api, aws, docker,
       jest, vitest, phpunit, zod, openapi, git, postman]
    highlights:
      - id: c-pocket-ecosystem
        tags: [fullstack, backend, node, php, python, frontend]
        text:
          es: Desarrollo y mantenimiento de servicios backend y aplicaciones web para varios productos SaaS con **Node.js, NestJS, Express, TypeScript, PHP/Laravel y Python/FastAPI**.
          en: Built and maintained backend services and web applications for several SaaS products with **Node.js, NestJS, Express, TypeScript, PHP/Laravel and Python/FastAPI**.
      - id: c-pocket-payments
        project: payments-platform
        tags: [payments, node, backend, api, fullstack]
        text:
          es: "Plataforma de pagos (**NestJS**): pagos con tarjeta y enlaces de pago, claves de idempotencia, consulta de estado, notificaciones por webhook y autenticación por API key con guards."
          en: "Payments platform (**NestJS**): card payments and payment links, idempotency keys, status polling, webhook notifications and API-key authentication with guards."
      - id: c-pocket-whatsapp
        project: conversational-platform
        tags: [node, automation, backend, ai]
        text:
          es: Flujos conversacionales de WhatsApp en la plataforma de automatización (**Node.js, Express**) para registro de usuarios, recargas y compra de pines, con sesiones, validaciones y reportes de ventas con permisos.
          en: WhatsApp conversational flows in the automation platform (**Node.js, Express**) for user registration, top-ups and PIN purchases, with sessions, validation and permission-based sales reports.
      - id: c-pocket-conversational-ai
        project: conversational-platform
        tags: [ai, node, automation]
        text:
          es: Integración de **OpenAI API** en la plataforma conversacional para conversaciones y automatización en WhatsApp mediante agentes de **LangChain** y herramientas de la aplicación.
          en: Contributed to **OpenAI API** integration in the conversational platform for WhatsApp conversations and automation using **LangChain** agents and application tools.
      - id: c-pocket-proptech
        project: proptech-platform
        tags: [fullstack, frontend, php, backend, automation]
        text:
          es: "Plataforma PropTech (**Laravel, React, Inertia**): gestión y búsqueda de propiedades, e integración con una plataforma externa de listados para importar, publicar y sincronizar propiedades con jobs y colas."
          en: "PropTech platform (**Laravel, React, Inertia**): property management and search, plus integration with an external listings platform to import, publish and sync listings with jobs and queues."
      - id: c-pocket-ticketing
        project: ticketing-ecosystem
        tags: [fullstack, frontend, node, backend]
        text:
          es: "Ecosistema de ticketing (**Node.js, Next.js, React**): API de tickets, operadores, productos, fechas y reportes; panel administrativo con calendario y reportes en Excel; validador QR de taquilla con bitácora de auditoría."
          en: "Ticketing ecosystem (**Node.js, Next.js, React**): API for tickets, operators, products, dates and reports; admin panel with a calendar and Excel reports; box-office QR validator with an audit log."
      - id: c-pocket-notifications
        project: notification-service
        tags: [backend, node, automation]
        text:
          es: Servicio de notificaciones en **NestJS** con correo (con reintentos), Slack y WhatsApp, generación de tickets PDF con QR y reportes programados por correo.
          en: Notification service in **NestJS** with email (with retries), Slack and WhatsApp, PDF tickets with QR codes and scheduled email reports.
      - id: c-pocket-operations
        project: operations-platform
        tags: [fullstack, frontend, php]
        text:
          es: "Sistema de gestión y operaciones (**Laravel, React**): tablero de tareas en lista y Kanban con permisos de equipo, vistas guardadas y filtros, y panel de ventas con alertas."
          en: "Business operations system (**Laravel, React**): task board with list and Kanban views, team permissions, saved views and filters, plus a sales dashboard with alerts."
      - id: c-pocket-ai-backend
        project: ai-backend
        tags: [ai, python, backend]
        text:
          es: Participación en un backend multi-tenant con **Python y FastAPI** (desarrollo detenido) para agentes de IA, procesamiento de información y búsqueda semántica con **PostgreSQL y pgvector**.
          en: Participated in a multi-tenant backend with **Python and FastAPI** (development halted) for AI agents, information processing and semantic search with **PostgreSQL and pgvector**.
      - id: c-pocket-mcp
        project: operations-platform
        tags: [ai]
        text:
          es: Trabajo en una integración en desarrollo con **Model Context Protocol (MCP)** para conectar Claude con herramientas y funcionalidades del sistema de operaciones.
          en: Worked on an in-progress **Model Context Protocol (MCP)** integration to connect Claude with the operations system's tools and features.
      # REVISAR: los CV previos declaran una reducción de ~53 s a <3 s en algunos procesos; sin
      # evidencia reproducible, no se publica (ver informe de métricas).
      - id: c-pocket-sql
        tags: [data, backend, python, node, fullstack]
        text:
          es: Optimización de consultas SQL y servicios backend, con manejo de transacciones e idempotencia.
          en: Optimized SQL queries and backend services, with transaction handling and idempotency.
      - id: c-pocket-aws
        tags: [cloud, backend, fullstack]
        text:
          es: Despliegue y mantenimiento de servicios en **AWS (ECS, EC2 y S3)** mediante Docker; diagnóstico de incidencias mediante logs.
          en: Deployed and maintained services on **AWS (ECS, EC2 and S3)** with Docker; diagnosed issues through logs.
      - id: c-pocket-quality
        tags: [quality, backend, fullstack, node, php]
        text:
          es: Pruebas automatizadas con **Jest, Vitest y PHPUnit**, pruebas funcionales, validación de integraciones y resolución de incidencias en producción.
          en: Automated tests with **Jest, Vitest and PHPUnit**, functional testing, integration validation and production incident resolution.

