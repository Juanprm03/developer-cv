# yaml-language-server: $schema=../schema/profile.schema.json
#
# PERFIL MAESTRO: única fuente de hechos profesionales. Web y PDF se derivan de aquí.
#
# Fuentes (revisadas en lectura, sin modificar):
# - CV previos del propietario y sus notas de verificación.
# - Repositorios del empleador: README, manifiestos y autoría de commits propios.
# - Confirmaciones del propietario (email, SENA 2023–2025, C-Pocket oct. 2025 – oct. 2026).
#
# Niveles de evidencia (ver docs/ARCHITECTURE.md):
# - Verificado: código o historial de Git propio.
# - Declarado: CV previos aprobados por el propietario, sin repositorio disponible
#   (se redacta como "participación" o "en desarrollo").
# Lo que no está respaldado no se publica: queda en la lista de pendientes.
#
# Contexto de cada skill: professional (usada en un empleo), personal (proyectos propios)
# o learning (en formación). Solo professional puede figurar como experiencia laboral.

