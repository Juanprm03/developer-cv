site:
  kicker:
    es: "Fullstack Software Developer | Backend, Cloud & AI"
    en: "Fullstack Software Developer | Backend, Cloud & AI"
  headline:
    es: Construyo productos web completos, de las APIs y los servicios a la interfaz, la nube y la IA aplicada.
    en: I build complete web products, from APIs and services to the interface, the cloud and applied AI.
  intro:
    es: >-
      Trabajo con el stack que cada producto necesita —Node.js y NestJS, Laravel, Python, React y Next.js— en
      servicios que se comunican por APIs, webhooks e integraciones con terceros: pagos, WhatsApp, notificaciones,
      ticketing y agentes de IA.
    en: >-
      I work with the stack each product needs —Node.js and NestJS, Laravel, Python, React and Next.js— on
      services that talk to each other through APIs, webhooks and third-party integrations: payments, WhatsApp,
      notifications, ticketing and AI agents.
  # Declarado por el propietario: empleo verificable desde 2025-04 + proyectos personales.
  # No es duración de empleo formal (19 meses); solo se muestra en la web, no en los PDF.
  experience:
    es: Más de 2 años de experiencia combinada entre trabajo profesional y proyectos personales.
    en: Over 2 years of combined experience across professional work and personal projects.
  specializations:
    - { id: backend, title: { es: Backend y APIs, en: Backend & APIs }, skills: [nodejs, nestjs, laravel, fastapi] }
    - { id: frontend, title: { es: Frontend web, en: Web frontend }, skills: [react, nextjs, typescript] }
    - id: services
      title: { es: Servicios distribuidos, en: Distributed services }
      skills: [rest-apis, webhooks, redis]
    - { id: cloud, title: { es: Cloud y contenedores, en: Cloud & containers }, skills: [aws, docker] }
    - { id: ai, title: { es: IA aplicada, en: Applied AI }, skills: [openai-api, langchain, pgvector] }
    - id: integrations
      title: { es: Integraciones, en: Integrations }
      skills: [whatsapp-cloud-api, slack-api, postman]
  # Experiencia en cifras: solo indicadores con definición y evidencia (ver docs/ARCHITECTURE.md).
  figures:
    - id: combined-experience
      value: { es: "+2", en: "2+" }
      label: { es: años de experiencia combinada, en: years of combined experience }
      note:
        es: Trabajo profesional desde 2025 y proyectos personales; no equivale a años de empleo formal.
        en: Professional work since 2025 plus personal projects; not years of formal employment.
    - id: contributed-apps
      value: { es: "8", en: "8" }
      label: { es: aplicaciones y servicios con contribuciones propias, en: applications and services with my own contributions }
      note:
        es: Repositorios de C-Pocket con contribuciones propias verificadas en su historial; desarrollados en equipo.
        en: C-Pocket repositories with my own contributions verified in their history; built as a team.
    - id: independent-services
      value: { es: "3", en: "3" }
      label: { es: servicios desplegables de forma independiente, en: independently deployable services }
      note:
        es: Comunicados por APIs y webhooks; contribuí en los tres.
        en: Communicating through APIs and webhooks; I contributed to all three.
  domains:
    - { id: payments, text: { es: Pagos y fintech, en: Payments & fintech } }
    - id: conversational
      text: { es: Automatización conversacional (WhatsApp), en: Conversational automation (WhatsApp) }
    - { id: ai, text: { es: IA aplicada y agentes, en: Applied AI & agents } }
    - { id: proptech, text: { es: PropTech e integración de datos, en: PropTech & data integration } }
    - { id: ticketing, text: { es: Venta y validación de tickets, en: Ticket sales & validation } }
    - { id: internal, text: { es: Herramientas internas y reportes, en: Internal tools & reporting } }
  approach:
    title:
      es: Entender primero, construir con criterio
      en: Understand first, build with judgment
    intro:
      es: >-
        Antes de escribir código quiero saber qué problema resuelve y para quién. A partir de ahí busco
        soluciones que el equipo pueda mantener, probar y hacer crecer, con la tecnología que el producto
        necesita y no con la que más me gusta.
      en: >-
        Before writing code I want to know what problem it solves and for whom. From there I look for
        solutions the team can maintain, test and grow, with the technology the product needs rather
        than the one I like best.
  principles:
    - id: problem-first
      title: { es: El problema antes que el código, en: The problem before the code }
      description:
        es: Me involucro en los requerimientos y en la necesidad del negocio para construir lo que de verdad hace falta, no solo lo que dice un ticket.
        en: I get involved in requirements and business needs to build what is actually needed, not just what a ticket says.
      example:
        es: En C-Pocket trabajé con producto y equipos multidisciplinarios para analizar necesidades y entregar funcionalidades de principio a fin.
        en: At C-Pocket I worked with product and cross-functional teams to analyze needs and deliver features end to end.
    - id: architecture
      title: { es: Diseñar para que el sistema pueda crecer, en: Design so the system can grow }
      description:
        es: Pienso en límites claros, contratos entre servicios y código que otra persona pueda entender y cambiar.
        en: I think about clear boundaries, contracts between services and code someone else can understand and change.
      example:
        es: En la plataforma de pagos, los pagos se organizan en casos de uso con un adaptador por proveedor detrás de una interfaz común.
        en: In the payments platform, payments are organized into use cases with one adapter per provider behind a common interface.
    - id: quality
      title: { es: Calidad que se puede comprobar, en: Quality you can verify }
      description:
        es: Las pruebas automatizadas y las revisiones de código son parte del trabajo, no un paso opcional al final.
        en: Automated tests and code reviews are part of the work, not an optional step at the end.
      example:
        es: Pruebas con Jest, Vitest y PHPUnit en productos de C-Pocket, y con pytest en mi ERP personal, incluidos permisos, aislamiento de datos y concurrencia.
        en: Tests with Jest, Vitest and PHPUnit in C-Pocket products, and with pytest in my personal ERP, covering permissions, data isolation and concurrency.
    - id: production
      title: { es: Producción observable, en: Observable production }
      description:
        es: Quiero saber qué pasa en producción y poder explicarlo, con logs útiles, trazabilidad y cambios que se pueden seguir.
        en: I want to know what happens in production and be able to explain it, with useful logs, traceability and changes you can follow.
      example:
        es: Identificadores de traza en los pagos de la plataforma conversacional, bitácora de auditoría en el validador QR y diagnóstico de incidencias mediante logs.
        en: Trace ids on the conversational platform's payments, an audit log in the QR validator and log-based incident diagnosis.
    - id: ai-judgment
      title: { es: "IA como herramienta, con criterio propio", en: "AI as a tool, with my own judgment" }
      description:
        es: Uso IA y automatización para avanzar más rápido, pero reviso, pruebo y decido; la responsabilidad del resultado sigue siendo mía.
        en: I use AI and automation to move faster, but I review, test and decide; I stay responsible for the result.
      example:
        es: Contribuí a integrar agentes de LangChain con herramientas acotadas de la aplicación en la plataforma conversacional y automaticé reportes programados por correo.
        en: I helped integrate LangChain agents with scoped application tools in the conversational platform and automated scheduled email reports.
    - id: adaptability
      title: { es: El stack al servicio del producto, en: The stack serves the product }
      description:
        es: Me adapto a la tecnología y al contexto de cada proyecto, y aprendo lo que haga falta para entregarlo bien.
        en: I adapt to each project's technology and context, and learn whatever it takes to deliver it well.
      example:
        es: En C-Pocket trabajé con Node.js y NestJS, Laravel, Python/FastAPI y Next.js según lo que necesitaba cada producto.
        en: At C-Pocket I worked with Node.js and NestJS, Laravel, Python/FastAPI and Next.js depending on what each product needed.

