name: Deploy CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reconstrucción mensual: mantiene al día la duración de un empleo en curso.
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # rehype-mermaid renderiza los diagramas a SVG en build con Chromium (también lo usa
      # la auditoría de accesibilidad). poppler-utils aporta pdftotext para validar los PDF.
      - name: Install Chromium y pdftotext
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Check (datos, tipos, lint)
        run: pnpm check

      - name: Tests (resolutor, integridad, paridad)
        run: pnpm test

      # Incluye: PDF de todas las variantes, verificación con pdftotext y enlaces internos.
      - name: Build (PDF + web)
        run: pnpm build
        env:
          # Referencias profesionales (datos de terceros): solo en el PDF, nunca en el repositorio.
          CV_REFERENCES: ${{ secrets.CV_REFERENCES }}
          # Obligatorio al publicar; los PR (p. ej. desde forks) no reciben secretos.
          CV_REQUIRE_REFERENCES: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          SITE: ${{ steps.pages.outputs.origin || 'https://juanprm03.github.io' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/developer-cv' }}

      - name: Accesibilidad (axe, sin JS, teclado)
        run: pnpm a11y
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/developer-cv' }}

      # En PRs, los PDFs quedan como artefacto descargable para revisarlos antes de publicar.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: cv-pdf
          # Solo el CV público: las variantes internas nunca se suben como artefacto.
          path: dist/cv-*.pdf
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
